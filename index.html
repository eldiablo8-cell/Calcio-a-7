<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcio a 7 U10</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1b2a1b;--mut:#6b7a6b;--ac:#1f8a3b;--ac2:#e8f5ea;--rd:#c0392b;--bd:#dde3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121712;--card:#1c241c;--tx:#e8efe8;--mut:#93a193;--ac:#3fbf5f;--ac2:#1f3324;--rd:#e5675a;--bd:#2c382c}}
:root[data-theme="dark"]{--bg:#121712;--card:#1c241c;--tx:#e8efe8;--mut:#93a193;--ac:#3fbf5f;--ac2:#1f3324;--rd:#e5675a;--bd:#2c382c}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.score{display:flex;align-items:center;justify-content:center;gap:14px;font-size:44px;font-weight:800}
.score small{display:block;font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.clock{text-align:center;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 0}
.sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.d{color:var(--rd)}
button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.grow{flex:1}
input{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);flex:1;min-width:0}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pl{display:flex;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid var(--bd);margin-bottom:6px}
.pl.on{background:var(--ac2);border-color:var(--ac)}
.pl .n{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.pl .t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.pl button{padding:8px 10px}
.log{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.muted{color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:4px 3px;text-align:center}td:first-child,th:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="score">
    <div><span id="sa">0</span><small>NOI</small></div><div>–</div><div><span id="sb">0</span><small>AVVERSARI</small></div>
  </div>
  <div class="sub" id="per" style="margin-top:6px"></div>
  <div class="clock" id="clock">00:00</div>
  <div class="sub" id="tot"></div>
  <div class="row">
    <button class="p grow" id="go">▶ Avvia</button>
    <button id="opp">+ Gol avversari</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="grow" id="next">Fine tempo</button>
  </div>
  <div class="row" style="margin-top:10px">
    <span class="muted">Numero di tempi:</span>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
  </div>
  <div class="muted" id="oncount" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>Giocatori</h2>
  <div class="muted" id="hint" style="margin-bottom:8px"></div>
  <div id="list"></div>
  <div class="row" style="margin-top:8px">
    <input id="name" placeholder="Nome giocatore" maxlength="30">
    <button class="p" id="add">Aggiungi</button>
  </div>
</div>

<div class="card">
  <h2>Gol</h2>
  <div id="log"></div>
</div>

<div class="card">
  <h2>Riepilogo</h2>
  <div id="sum" style="overflow-x:auto"></div>
  <div class="row" style="margin-top:10px">
    <button id="newm" class="d">Nuova partita</button>
  </div>
</div>

<script>
var KEY="calcio7u10";
var S={players:[],goals:[],elapsed:0,done:0,period:1,nper:3,running:false,last:0,nid:1};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k];S.running=false;}}catch(e){}
S.players.forEach(function(p){if(!p.per)p.per=[p.ms||0,0,0,0];});
S.goals.forEach(function(g){if(!g.p)g.p=1;});
var conf=null,ct=null;
function ask(k){conf=k;clearTimeout(ct);ct=setTimeout(function(){conf=null;render();},4000);render();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function pname(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i].name;return "?";}
function gcount(id){return S.goals.filter(function(g){return g.pid===id;}).length;}
function started(){return S.running||S.elapsed>0||S.done>0;}

function tick(){
  if(S.running){
    var now=Date.now(),d=now-S.last;S.last=now;S.elapsed+=d;
    S.players.forEach(function(p){if(p.on){p.ms+=d;p.per[S.period-1]+=d;}});
    upd();
  }
}
function upd(){
  $("clock").textContent=fmt(S.elapsed);
  $("tot").textContent="Totale gara "+fmt(S.done+S.elapsed);
  S.players.forEach(function(p){var e=document.querySelector('[data-t="'+p.id+'"]');if(e)e.textContent=fmt(p.ms);});
}
function render(){
  if(S.nper<S.period)S.nper=S.period;
  var a=S.goals.filter(function(g){return g.pid!==null;}).length;
  $("sa").textContent=a;$("sb").textContent=S.goals.length-a;
  $("per").textContent="Tempo "+S.period+" di "+S.nper;
  $("go").textContent=S.running?"⏸ Pausa":"▶ "+(started()?"Riprendi":"Avvia partita");
  var last=S.period>=S.nper;
  $("next").disabled=last;
  $("next").textContent=last?"Ultimo tempo":"Fine tempo → inizia Tempo "+(S.period+1);
  document.querySelectorAll("button[data-n]").forEach(function(b){b.className=(+b.dataset.n===S.nper)?"sel":"";});
  var on=S.players.filter(function(p){return p.on;}).length;
  $("oncount").textContent="In campo: "+on+" / 7"+(on>7?" ⚠️ troppi giocatori":"");
  var pre=!started();
  $("hint").textContent=pre?"Tocca «Titolare» per chi parte in campo, poi premi Avvia: il tempo parte per tutti i titolari.":"Usa «Esce» / «Entra» per i cambi: il tempo di ognuno corre solo in campo.";
  $("list").innerHTML=S.players.length?S.players.map(function(p){
    var lbl=pre?(p.on?'✓ Titolare':'Titolare'):(p.on?'Esce':'Entra');
    return '<div class="pl'+(p.on?' on':'')+'"><div class="n">'+esc(p.name)+(gcount(p.id)?' ⚽'+gcount(p.id):'')+'</div>'+
    '<div class="t" data-t="'+p.id+'">'+fmt(p.ms)+'</div>'+
    '<button data-a="tog" data-i="'+p.id+'">'+lbl+'</button>'+
    '<button data-a="goal" data-i="'+p.id+'">⚽</button>'+
    '<button class="d" data-a="del" data-i="'+p.id+'">'+(conf==='del'+p.id?'Sicuro?':'✕')+'</button></div>';
  }).join(""):'<div class="muted">Aggiungi i giocatori per iniziare.</div>';
  $("log").innerHTML=S.goals.length?S.goals.map(function(g,i){
    return '<div class="log"><span>T'+g.p+' '+fmt(g.t)+' – '+(g.pid===null?'Avversari':'⚽ '+esc(pname(g.pid)))+'</span><button class="d" data-a="rg" data-i="'+i+'">✕</button></div>';
  }).join(""):'<div class="muted">Nessun gol ancora.</div>';
  var h='<table><tr><th>Giocatore</th>';
  for(var t=1;t<=S.nper;t++)h+='<th>T'+t+'</th>';
  h+='<th>Tot</th><th>Gol</th></tr>';
  S.players.forEach(function(p){
    h+='<tr><td>'+esc(p.name)+'</td>';
    for(var t=0;t<S.nper;t++)h+='<td>'+fmt(p.per[t]||0)+'</td>';
    h+='<td><b>'+fmt(p.ms)+'</b></td><td>'+gcount(p.id)+'</td></tr>';
  });
  $("sum").innerHTML=S.players.length?h+'</table>':'';
  $("newm").textContent=conf==='reset'?'Sicuro? Tocca ancora per azzerare':'Nuova partita';
  upd();save();
}
$("go").onclick=function(){S.running=!S.running;S.last=Date.now();render();};
$("opp").onclick=function(){S.goals.push({t:S.elapsed,p:S.period,pid:null});render();};
$("next").onclick=function(){
  if(S.period>=S.nper)return;
  S.done+=S.elapsed;S.elapsed=0;S.period++;S.running=false;render();
};
document.querySelectorAll("button[data-n]").forEach(function(b){b.onclick=function(){S.nper=Math.max(+b.dataset.n,S.period);render();};});
$("add").onclick=function(){var v=$("name").value.trim();if(!v)return;S.players.push({id:S.nid++,name:v,on:false,ms:0,per:[0,0,0,0]});$("name").value="";render();};
$("name").onkeydown=function(e){if(e.key==="Enter")$("add").onclick();};
$("newm").onclick=function(){
  if(conf!=='reset'){ask('reset');return;}
  conf=null;S.goals=[];S.elapsed=0;S.done=0;S.period=1;S.running=false;
  S.players.forEach(function(p){p.ms=0;p.per=[0,0,0,0];p.on=false;});render();
};
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var a=b.dataset.a,i=+b.dataset.i;
  if(a==="rg"){S.goals.splice(i,1);}
  else{
    var p=S.players.filter(function(x){return x.id===i;})[0];if(!p)return;
    if(a==="tog")p.on=!p.on;
    else if(a==="goal")S.goals.push({t:S.elapsed,p:S.period,pid:p.id});
    else if(a==="del"){
      if(conf!=='del'+i){ask('del'+i);return;}
      conf=null;S.players=S.players.filter(function(x){return x.id!==i;});S.goals=S.goals.filter(function(g){return g.pid!==i;});
    }
  }
  render();
});
setInterval(tick,250);
render();
</script>
</body>
</html>
